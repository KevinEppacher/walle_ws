services:
  cpu:
    image: ros/control
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: ros_control
    privileged: true
    network_mode: host
    command: /bin/bash
    tty: true
    volumes:
      - ../../walle_ws:/app
      - /tmp/.X11-unix:/tmp/.X11-unix
      - $XAUTHORITY:/root/.Xauthority
    environment:
      QT_X11_NO_MITSHM: 1
      DISPLAY: $DISPLAY
  gpu:
    image: ros/control
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: ros_control
    privileged: true
    network_mode: host
    command: /bin/bash
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ../../walle_ws:/app
      - /tmp/.X11-unix:/tmp/.X11-unix
      - $XAUTHORITY:/root/.Xauthority
    environment:
      QT_X11_NO_MITSHM: 1
      DISPLAY: $DISPLAY
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
